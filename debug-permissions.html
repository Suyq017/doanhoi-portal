<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Permission System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        .info {
            color: blue;
        }

        .code {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 3px;
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>
    <h1>🔧 Debug Permission System</h1>

    <div class="test-section">
        <h2>Current State</h2>
        <div id="current-state"></div>
    </div>

    <div class="test-section">
        <h2>Test Login</h2>
        <button onclick="testLogin()">Login with user@gmail.com</button>
        <div id="login-result"></div>
    </div>

    <div class="test-section">
        <h2>Test Permissions</h2>
        <button onclick="testPermissions()">Check Permissions</button>
        <div id="permissions-result"></div>
    </div>

    <div class="test-section">
        <h2>Test Frontend Auth Context</h2>
        <button onclick="testFrontendAuth()">Check Frontend State</button>
        <div id="frontend-result"></div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:9200';
        let currentToken = null;

        function log(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            element.innerHTML += `<div class="${className}">${new Date().toLocaleTimeString()}: ${message}</div>`;
        }

        function logCode(elementId, data) {
            const element = document.getElementById(elementId);
            element.innerHTML += `<div class="code">${JSON.stringify(data, null, 2)}</div>`;
        }

        async function testLogin() {
            const resultDiv = document.getElementById('login-result');
            resultDiv.innerHTML = '';

            try {
                log('login-result', 'Attempting login...', 'info');

                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: "user@gmail.com",
                        password: "123456"
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    currentToken = data.accessToken;
                    log('login-result', '✅ Login successful!', 'success');
                    logCode('login-result', {
                        userId: data.user.id,
                        email: data.user.email,
                        tokenPreview: data.accessToken.substring(0, 50) + '...'
                    });

                    // Store in localStorage như frontend
                    localStorage.setItem('accessToken', data.accessToken);
                    localStorage.setItem('refreshToken', data.refreshToken);
                    localStorage.setItem('user', JSON.stringify(data.user));

                } else {
                    const error = await response.text();
                    log('login-result', `❌ Login failed: ${error}`, 'error');
                }
            } catch (error) {
                log('login-result', `❌ Error: ${error.message}`, 'error');
            }
        }

        async function testPermissions() {
            const resultDiv = document.getElementById('permissions-result');
            resultDiv.innerHTML = '';

            if (!currentToken) {
                log('permissions-result', '❌ No token available. Please login first.', 'error');
                return;
            }

            try {
                log('permissions-result', 'Testing permissions API...', 'info');

                // Test without org ID
                const response1 = await fetch(`${API_BASE_URL}/auth/me/permissions`, {
                    headers: {
                        'Authorization': `Bearer ${currentToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response1.ok) {
                    const data1 = await response1.json();
                    log('permissions-result', '📋 Permissions without org ID:', 'info');
                    logCode('permissions-result', data1);
                } else {
                    log('permissions-result', `❌ Permissions API failed: ${await response1.text()}`, 'error');
                }

                // Test with org ID
                const response2 = await fetch(`${API_BASE_URL}/auth/me/permissions?organizationId=7caebc06-c1b3-4ae8-bd7d-8d7837511341`, {
                    headers: {
                        'Authorization': `Bearer ${currentToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response2.ok) {
                    const data2 = await response2.json();
                    log('permissions-result', '🏢 Permissions with org ID:', 'info');
                    logCode('permissions-result', data2);

                    if (data2.roles && data2.roles.length > 0) {
                        const allPermissions = data2.roles.reduce((acc, role) => {
                            return [...acc, ...role.permissions.map(p => p.code)];
                        }, []);
                        const uniquePermissions = [...new Set(allPermissions)];

                        log('permissions-result', `✅ Found ${uniquePermissions.length} permissions`, 'success');

                        const importantPerms = ['dashboard.access', 'users.access', 'organizations.access', 'classes.access', 'departments.access', 'permissions.access'];
                        importantPerms.forEach(perm => {
                            const hasIt = uniquePermissions.includes(perm);
                            log('permissions-result', `${hasIt ? '✅' : '❌'} ${perm}`, hasIt ? 'success' : 'error');
                        });
                    }
                }

            } catch (error) {
                log('permissions-result', `❌ Error: ${error.message}`, 'error');
            }
        }

        function testFrontendAuth() {
            const resultDiv = document.getElementById('frontend-result');
            resultDiv.innerHTML = '';

            log('frontend-result', 'Checking localStorage...', 'info');

            const token = localStorage.getItem('accessToken');
            const user = localStorage.getItem('user');
            const refreshToken = localStorage.getItem('refreshToken');

            logCode('frontend-result', {
                hasToken: !!token,
                tokenPreview: token ? token.substring(0, 50) + '...' : null,
                hasUser: !!user,
                user: user ? JSON.parse(user) : null,
                hasRefreshToken: !!refreshToken
            });
        }

        function checkCurrentState() {
            const resultDiv = document.getElementById('current-state');

            const token = localStorage.getItem('accessToken');
            const user = localStorage.getItem('user');

            if (token && user) {
                const userData = JSON.parse(user);
                log('current-state', '✅ User is logged in', 'success');
                logCode('current-state', {
                    userId: userData.id,
                    email: userData.email,
                    userType: userData.userType
                });
                currentToken = token;
            } else {
                log('current-state', '❌ No active session found', 'error');
            }
        }

        // Check current state on load
        checkCurrentState();
    </script>
</body>

</html>
