include:
  - local: '.gitlab/ci/templates/ssh-deploy.yml'

deploy:staging:
  extends:                      
    - .ssh_deploy_base           
  stage: deploy-staging
  needs:
    - build:backend
    - build:frontend
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
      when: manual
    - if: $CI_COMMIT_BRANCH == "dev"
      when: manual
      allow_failure: true
  variables:
    ENVIRONMENT: "staging"
    COMPOSE_FILE: "docker-compose.prod.yml"
    # Mapping biến: Đảm bảo SSH_STAGING_KEY chứa chuỗi Base64 (LS0t...)
    SSH_PRIVATE_KEY: $SSH_STAGING_KEY
    DEPLOY_USER: "ec2-user"
    DEPLOY_SERVER: $STAGING_SERVER
    DEPLOY_PATH: "/home/ec2-user/doanhoi-portal"
  
  # 👇 THÊM PHẦN NÀY ĐỂ DEBUG VÀ FIX LỖI SSH 👇
  before_script:
    - echo "🔍 Đang cài đặt SSH Client..."
    - apk add --no-cache openssh-client curl bash
    
    - echo "🔍 Khởi động SSH Agent..."
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config

    - echo "🔍 DEBUG: Kiểm tra 10 ký tự đầu của Key (Để xem là Base64 hay PlainText)..."
    # Lệnh này sẽ in ra 10 chữ cái đầu. 
    # Nếu thấy 'LS0tLS...' -> Là Base64 (Đúng).
    # Nếu thấy '-----BEGIN' -> Là Text thường (Sai nếu dùng code giải mã bên dưới).
    - echo "$SSH_PRIVATE_KEY" | head -c 10
    - echo "" # Xuống dòng cho đẹp log

    - echo "🔑 Đang giải mã Base64 và thêm vào Agent..."
    # Dòng này sửa lỗi libcrypto/invalid format bằng cách giải mã Base64
    - echo "$SSH_PRIVATE_KEY" | base64 -d | ssh-add -
    
    - echo "✅ SSH Key added successfully!"

  script:
    - echo "🚀 Deploying to STAGING version $CI_COMMIT_SHORT_SHA..."
    # Test kết nối thử trước khi chạy lệnh copy
    - ssh -T ${DEPLOY_USER}@${DEPLOY_SERVER} || echo "⚠️ Kết nối SSH Test thất bại, nhưng sẽ thử tiếp..."
    
    - scp ${COMPOSE_FILE} ${DEPLOY_USER}@${DEPLOY_SERVER}:${DEPLOY_PATH}/docker-compose.yml
    - |
      ssh ${DEPLOY_USER}@${DEPLOY_SERVER} << ENDSSH
        set -e
        cd ${DEPLOY_PATH}
        
        echo "📦 Backing up current version..."
        docker compose config | grep "image:" > .previous-images.txt || true
        
        echo "🔐 Logging into Registry..."
        echo "${CI_REGISTRY_PASSWORD}" | docker login -u "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
        
        echo "⬇️ Pulling new version..."
        export TAG=${CI_COMMIT_SHORT_SHA}
        export CI_REGISTRY_IMAGE=${CI_REGISTRY_IMAGE}
        
        docker compose -f docker-compose.yml pull
        
        echo "🔄 Deploying..."
        docker compose -f docker-compose.yml up -d --remove-orphans
        
        echo "⏳ Waiting for services to be healthy..."
        sleep 20
        
        echo "✅ Deployment completed"
        docker compose -f docker-compose.yml ps
        
        echo "🧹 Cleanup old images..."
        docker image prune -f --filter "until=24h"
      ENDSSH
  environment:
    name: staging
    url: http://ec2-52-90-100-205.compute-1.amazonaws.com