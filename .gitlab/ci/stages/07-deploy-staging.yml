include:
  - local: '.gitlab/ci/templates/ssh-deploy.yml'

deploy:staging:
  extends:
    - .ssh_deploy_base
  stage: deploy-staging
  needs:
    - build:backend
    - build:frontend
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
      when: manual
    - if: $CI_COMMIT_BRANCH == "dev"
      when: manual
      allow_failure: true
  variables:
    ENVIRONMENT: "staging"
    COMPOSE_FILE: "docker-compose.prod.yml"
    DEPLOY_USER: "ec2-user"
    DEPLOY_SERVER: "$STAGING_SERVER"
    DEPLOY_PATH: "/home/ec2-user/doanhoi-portal"
    SSH_STAGING_KEY: "$SSH_STAGING_KEY"

  # --- PHẦN QUAN TRỌNG ĐÃ SỬA ---
  before_script:
    - apk add --no-cache openssh-client curl bash
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    # Dùng nháy đơn bao quanh lệnh có ký tự đặc biệt để tránh lỗi YAML
    - 'echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config'
    
    # DEBUG: Kiểm tra xem biến có phải Base64 không (in 10 ký tự đầu)
    - echo "Check Key Format:"
    - echo "$SSH_PRIVATE_KEY" | head -c 10
    
    # GIẢI MÃ BASE64 VÀ ADD KEY (Quan trọng nhất)
    - echo "$SSH_PRIVATE_KEY" | base64 -d | ssh-add -

  script:
    - echo "🚀 Deploying to STAGING version $CI_COMMIT_SHORT_SHA..."
    
    # Copy file docker-compose lên server
    - scp $COMPOSE_FILE $DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/docker-compose.yml
    
    # SSH vào server và chạy lệnh
    - |
      ssh $DEPLOY_USER@$DEPLOY_SERVER << ENDSSH
        set -e
        cd $DEPLOY_PATH
        
        echo "📦 Backing up current version..."
        docker compose config | grep "image:" > .previous-images.txt || true
        
        echo "🔐 Logging into Registry..."
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        
        echo "⬇️ Pulling new version..."
        export TAG=$CI_COMMIT_SHORT_SHA
        export CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE
        
        docker compose -f docker-compose.yml pull
        
        echo "🔄 Deploying..."
        docker compose -f docker-compose.yml up -d --remove-orphans
        
        echo "⏳ Waiting for services to be healthy..."
        sleep 20
        
        echo "✅ Deployment completed"
        docker compose -f docker-compose.yml ps
        
        echo "🧹 Cleanup old images..."
        docker image prune -f --filter "until=24h"
      ENDSSH

  environment:
    name: staging
    url: http://ec2-52-90-100-205.compute-1.amazonaws.com