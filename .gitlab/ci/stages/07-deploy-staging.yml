deploy:staging:
  extends:
    - .ssh_deploy_base
    - .notify_success
  stage: deploy-staging
  needs:
    - build:backend
    - build:frontend
    - job: security:audit
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "dev"
      when: manual
      allow_failure: true
  variables:
    ENVIRONMENT: "staging"
    COMPOSE_FILE: "docker-compose.prod.yml"
    DEPLOY_SSH_KEY: $SSH_STAGING_KEY
    DEPLOY_USER: "ec2-user"
    DEPLOY_SERVER: "$STAGING_SERVER"
    DEPLOY_PATH: "/home/ec2-user/doanhoi-portal"

  script:
    - echo "🚀 Deploying to STAGING version $CI_COMMIT_SHORT_SHA..."
    
    # Copy file docker-compose và prometheus config lên server
    - scp $COMPOSE_FILE $DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/docker-compose.yml
    - scp prometheus.prod.yml $DEPLOY_USER@$DEPLOY_SERVER:$DEPLOY_PATH/prometheus.prod.yml
    
    # SSH vào server và chạy lệnh
    - |
      ssh $DEPLOY_USER@$DEPLOY_SERVER << ENDSSH
        set -e
        cd $DEPLOY_PATH
        
        echo "📦 Backing up current version..."
        docker compose ps --format '{{.Image}}' > .previous-images.txt || true
        
        echo "🔐 Logging into Registry..."
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        
        echo "⬇️ Pulling new version..."
        export TAG=$CI_COMMIT_SHORT_SHA
        export CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE
        
        docker compose -f docker-compose.yml pull
        
        echo "🔄 Deploying..."
        docker compose -f docker-compose.yml up -d --remove-orphans
        
        echo "⏳ Running health check..."
        HEALTHY=false
        for i in \$(seq 1 10); do
          HTTP_CODE=\$(curl -s -o /dev/null -w "%{http_code}" http://localhost:2681/api || echo "000")
          if [ "\$HTTP_CODE" = "200" ] || [ "\$HTTP_CODE" = "301" ]; then
            HEALTHY=true
            echo "✅ Health check passed on attempt \$i"
            break
          fi
          echo "⏳ Health check attempt \$i/10 failed (HTTP \$HTTP_CODE)"
          sleep 15
        done

        if [ "\$HEALTHY" = "false" ]; then
          echo "❌ Health check failed! Rolling back..."
          if [ -f .previous-images.txt ]; then
            echo "🔄 Pulling previous images..."
            while IFS= read -r img; do
              docker pull "\$img" 2>/dev/null || true
            done < .previous-images.txt
            docker compose -f docker-compose.yml up -d --remove-orphans
            echo "🔄 Rollback completed"
          fi
          exit 1
        fi
        
        echo "✅ Deployment completed"
        docker compose -f docker-compose.yml ps
        
        echo "🧹 Cleanup old Docker images..."
        docker image prune -f
        docker builder prune -f --filter "until=72h" 2>/dev/null || true
        
        echo "📊 Disk usage after cleanup:"
        docker system df
      ENDSSH

  environment:
    name: staging
    url: http://ec2-47-128-218-97.ap-southeast-1.compute.amazonaws.com
