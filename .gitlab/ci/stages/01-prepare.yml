prepare:dependencies:
  stage: prepare
  image: node:${NODE_VERSION}-alpine
  extends:
    - .node_cache
    - .rules_main_branches
  script:
    - echo "Warming npm cache for backend..."
    - cd backend && npm ci --cache ../.npm --prefer-offline
    - echo "Warming npm cache for frontend..."
    - cd ../frontend && npm ci --cache ../.npm --prefer-offline
    - echo "npm cache warmed - downstream jobs will install from cache (offline)"
