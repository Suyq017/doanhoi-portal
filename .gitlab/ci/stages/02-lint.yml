lint:backend:
  stage: lint
  image: node:${NODE_VERSION}-alpine
  extends:
    - .rules_main_branches
  needs:
    - prepare:dependencies
  before_script:
    - (cd backend && npm rebuild 2>/dev/null || true)
  script:
    - cd backend
    - npm run lint
  allow_failure: true

lint:frontend:
  stage: lint
  image: node:${NODE_VERSION}-alpine
  extends:
    - .rules_main_branches
  needs:
    - prepare:dependencies
  before_script:
    - (cd frontend && npm rebuild 2>/dev/null || true)
  script:
    - cd frontend
    - npm run lint
  allow_failure: true
