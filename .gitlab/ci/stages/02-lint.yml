lint:backend:
  stage: lint
  image: node:${NODE_VERSION}-alpine
  extends:
    - .node_cache
    - .rules_main_branches
  needs:
    - prepare:dependencies
  script:
    - cd backend
    - npm ci --cache ../.npm --prefer-offline
    - npm run lint
  allow_failure: true

lint:frontend:
  stage: lint
  image: node:${NODE_VERSION}-alpine
  extends:
    - .node_cache
    - .rules_main_branches
  needs:
    - prepare:dependencies
  script:
    - cd frontend
    - npm ci --cache ../.npm --prefer-offline
    - npm run lint
  allow_failure: true
