test:backend:
  stage: test
  image: node:${NODE_VERSION}-alpine
  extends:
    - .node_cache
    - .rules_main_branches
  needs:
    - prepare:dependencies
  services:
    - name: pgvector/pgvector:pg15
      alias: postgres
      variables:
        POSTGRES_DB: doanhoi_test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: test_password
  variables:
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_USERNAME: postgres
    DB_PASSWORD: test_password
    DB_NAME: doanhoi_test
    NODE_ENV: test
  script:
    - cd backend
    - npm ci --cache ../.npm --prefer-offline
    - npm run test:cov -- --ci --forceExit
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    paths:
      - backend/coverage/
    when: always
    expire_in: 7 days

test:frontend:
  stage: test
  image: node:${NODE_VERSION}-alpine
  extends:
    - .node_cache
    - .rules_main_branches
  needs:
    - prepare:dependencies
  script:
    - cd frontend
    - npm ci --cache ../.npm --prefer-offline
    - npm run test
  artifacts:
    paths:
      - frontend/coverage/
    when: always
    expire_in: 7 days
