# Rules templates - KHÔNG DÙNG COLON trong tên template!
.rules_main_branches:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^(dev|staging|main)$/

.rules_staging_only:
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"

.rules_production_only:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

.rules_manual:
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(dev|staging|main)$/
      when: manual
    - when: never