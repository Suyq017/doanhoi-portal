.ssh_deploy_base:
  image: alpine:3.19
  before_script:
    - echo "Setting up SSH..."
    - apk add --no-cache openssh-client curl
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure