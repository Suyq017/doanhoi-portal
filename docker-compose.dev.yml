version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: doanhoi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: doanhoi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "9000:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - doanhoi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d doanhoi"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: doanhoi-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@doanhoi.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "9001:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - doanhoi-network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  doanhoi-network:
    driver: bridge
