stages:
  - build
  - package
  - deploy

variables:
  DEPLOY_PATH: "/opt/doanhoi-portal"
  BACKEND_PORT: "9200"

build:
  stage: build
  image: node:20
  script:
    - echo "Building backend..."
    - cd backend
    - npm ci
    - npm run build
    - echo "Building frontend..."
    - cd ../frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - backend/dist/
      - frontend/dist/
      - docker-compose.prod.yml
      - backend/Dockerfile.prod
      - frontend/Dockerfile.prod
      - backend/package*.json
      - frontend/package*.json
    expire_in: 1 hour
  only:
    - dev

# Package everything into a deployable archive
package:
  stage: package
  image: alpine:latest
  script:
    - echo "Creating deployment package..."
    - mkdir -p deploy-package/backend deploy-package/frontend
    - cp -r backend/dist deploy-package/backend/
    - cp -r frontend/dist deploy-package/frontend/
    - cp docker-compose.prod.yml deploy-package/
    - cp backend/Dockerfile.prod deploy-package/backend/
    - cp frontend/Dockerfile.prod deploy-package/frontend/
    - cp backend/package*.json deploy-package/backend/ || true
    - cp frontend/package*.json deploy-package/frontend/ || true
    - tar -czf deployment.tar.gz deploy-package/
    - echo "Package created successfully"
  artifacts:
    paths:
      - deployment.tar.gz
    expire_in: 1 hour
  only:
    - dev

# Deploy instructions (manual step)
deploy:production:
  stage: deploy
  image: alpine:latest
  script:
    - echo "==================================="
    - echo "DEPLOYMENT INSTRUCTIONS"
    - echo "==================================="
    - echo "1. Download the deployment.tar.gz artifact"
    - echo "2. Upload to your server at /tmp/deployment.tar.gz"
    - echo "3. Run these commands on your server:"
    - echo ""
    - echo "   cd /tmp"
    - echo "   tar -xzf deployment.tar.gz"
    - echo "   sudo rm -rf $DEPLOY_PATH/*"
    - echo "   sudo cp -r deploy-package/* $DEPLOY_PATH/"
    - echo "   sudo chown -R gitlab-runner:gitlab-runner $DEPLOY_PATH"
    - echo "   cd $DEPLOY_PATH"
    - echo "   sudo docker-compose -f docker-compose.prod.yml down || true"
    - echo "   sudo docker-compose -f docker-compose.prod.yml up -d --build"
    - echo "   sudo cp -r frontend/dist/* /opt/doanhoi-portal/frontend/"
    - echo "   sudo systemctl reload nginx"
    - echo ""
    - echo "4. Check deployment:"
    - echo "   sudo docker-compose -f $DEPLOY_PATH/docker-compose.prod.yml ps"
    - echo "   curl http://localhost:$BACKEND_PORT/api"
    - echo "==================================="
    - ls -la deployment.tar.gz
  artifacts:
    paths:
      - deployment.tar.gz
    expire_in: 1 week
  environment:
    name: production
    url: http://103.88.121.146
  only:
    - dev
  when: manual
