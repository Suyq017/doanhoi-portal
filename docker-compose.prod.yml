version: '3.8'

services:
  # Database PostgreSQL
  postgres:
    image: postgres:15
    container_name: doanhoi-postgres-prod
    environment:
      POSTGRES_DB: doanhoi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "2679:5432"  # Expose PostgreSQL for debugging
    volumes:
      - doanhoi_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - doanhoi-network

  # Backend NestJS
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: doanhoi-backend-prod
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: doanhoi
      PORT: 9200
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: 60m
      JWT_REFRESH_EXPIRES_IN: 7d
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
    ports:
      - "2681:9200"   # expose backend ra port 2681
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - doanhoi-network

  # Frontend React served by nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: doanhoi-frontend-prod
    environment:
      NODE_ENV: production
    ports:
      - "2680:80"   # expose frontend ra port 2680
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - doanhoi-network

networks:
  doanhoi-network:
    driver: bridge

volumes:
  doanhoi_postgres_data:
