version: '3.8'

services:
  # Database PostgreSQL (with pgvector for RAG)
  postgres:
    image: pgvector/pgvector:pg15
    container_name: doanhoi-postgres-prod
    environment:
      POSTGRES_DB: doanhoi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "2682:5432"
    volumes:
      - doanhoi_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -d doanhoi -c 'CREATE EXTENSION IF NOT EXISTS vector' >/dev/null 2>&1 || true"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - doanhoi-network

  # Backend NestJS
  backend:
    # build:
    #   context: ./backend
    #   dockerfile: Dockerfile.prod
    image: ${CI_REGISTRY_IMAGE}/backend:${TAG:-latest}
    container_name: doanhoi-backend-prod
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: doanhoi
      PORT: 9200
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: 60m
      JWT_REFRESH_EXPIRES_IN: 7d
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
    ports:
      - "2681:9200"   # expose backend ra port 2681
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - doanhoi-network

  # Frontend React served by nginx
  frontend:
    # build:
    #   context: ./frontend
    #   dockerfile: Dockerfile.prod
    image: ${CI_REGISTRY_IMAGE}/frontend:${TAG:-latest}
    container_name: doanhoi-frontend-prod
    environment:
      NODE_ENV: production
    ports:
      - "2680:80"   # expose frontend ra port 2680
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - doanhoi-network

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: doanhoi-prometheus-prod
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'  # Keep data for 30 days
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'  # Allow reload via API
      - '--web.route-prefix=/prometheus'  # Serve under /prometheus path
    volumes:
      - ./prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"  # Map host port 9091 to container port 9090 (avoid conflict with systemd)
    restart: unless-stopped
    networks:
      - doanhoi-network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: doanhoi-grafana-prod
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}  # CHANGE THIS in .env.production!
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3002}  # Update with your domain
      - GF_SERVER_DOMAIN=${GRAFANA_DOMAIN:-localhost}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true  # Required for /grafana/ path
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_ALLOW_ORG_CREATE=false
      - GF_LOG_LEVEL=warn  # Reduce log verbosity in production
      - GF_INSTALL_PLUGINS=  # Add plugins if needed
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3002:3000"  # Expose Grafana (should be behind reverse proxy in production)
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - doanhoi-network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  doanhoi-network:
    driver: bridge

volumes:
  doanhoi_postgres_data:
  prometheus_data:  # Volume for Prometheus data persistence
  grafana_data:     # Volume for Grafana data persistence
