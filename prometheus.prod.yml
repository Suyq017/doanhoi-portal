global:
  scrape_interval: 15s      # Production: scrape every 15s (less frequent than dev)
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    environment: 'production'
    cluster: 'doanhoi-portal'

# Alertmanager configuration (optional, for alerts)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - 'alertmanager:9093'  # Uncomment if you setup alertmanager

# Load alerting rules
rule_files:
  # - "/etc/prometheus/rules/*.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    metrics_path: '/prometheus/metrics'  # Must match --web.route-prefix
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          environment: 'production'

  # Backend API monitoring
  - job_name: 'doanhoi-backend-api'
    scrape_interval: 10s
    metrics_path: '/metrics'  # Endpoint exposed by @willsoto/nestjs-prometheus
    static_configs:
      - targets: ['backend:9200']  # Docker service name + container port (not host port 2681)
        labels:
          service: 'backend-api'
          app: 'doanhoi-portal'
          tier: 'api'
          environment: 'production'
    # Add authentication if your /metrics endpoint is protected
    # basic_auth:
    #   username: 'prometheus'
    #   password: 'your-secure-password'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'doanhoi-backend-production'

  # Frontend monitoring (if you expose metrics from nginx)
  # - job_name: 'doanhoi-frontend'
  #   static_configs:
  #     - targets: ['frontend:80']
  #       labels:
  #         service: 'frontend'
  #         app: 'doanhoi-portal'
  #         environment: 'production'

  # PostgreSQL Exporter (optional, for database metrics)
  # Requires postgres_exporter service in docker-compose
  # - job_name: 'postgres-exporter'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
  #       labels:
  #         service: 'postgres'
  #         app: 'doanhoi-portal'
  #         environment: 'production'

  # Node Exporter (optional, for server metrics)
  # Requires node_exporter service in docker-compose
  # - job_name: 'node-exporter'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
  #       labels:
  #         service: 'node-exporter'
  #         environment: 'production'

  # Redis Exporter (optional, if you use Redis)
  # - job_name: 'redis-exporter'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
  #       labels:
  #         service: 'redis'
  #         app: 'doanhoi-portal'
  #         environment: 'production'
