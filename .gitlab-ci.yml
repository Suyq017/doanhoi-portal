stages:
  - build
  - deploy

variables:
  DEPLOY_PATH: "/opt/doanhoi-portal"
  BACKEND_PORT: "9200"

# Build trên Docker - không cần git clone trên server
build:
  stage: build
  image: node:20
  script:
    - echo "Building application"
    - cd backend && npm ci && npm run build
    - cd ../frontend && npm ci && npm run build
  artifacts:
    paths:
      - backend/dist/
      - frontend/dist/
      - docker-compose.prod.yml
      - backend/Dockerfile.prod
      - frontend/Dockerfile.prod
      - backend/package*.json
      - frontend/package*.json
    expire_in: 2 hours
  only:
    - dev

# Deploy chỉ sử dụng artifacts - không cần git clone
deploy:production:
  stage: deploy
  tags:
    - deploy
    - production
  variables:
    GIT_STRATEGY: none
  dependencies:
    - build
  script:
    - echo "Deploying using artifacts only - no git operations"
    - pwd && ls -la
    - echo "Checking artifacts"
    - ls -la backend/dist/ || echo "No backend dist"
    - ls -la frontend/dist/ || echo "No frontend dist"
    - echo "Checking current permissions"
    - whoami
    - groups
    - echo "Testing directory access"
    - test -w /opt && echo "Can write to /opt" || echo "Cannot write to /opt - need sudo setup"
    - echo "Creating deployment directories with fallback"
    - mkdir -p ~/deployment/backend ~/deployment/frontend || echo "Using home directory fallback"
    - echo "Copying application files to temp location"
    - cp -r backend/dist ~/deployment/backend/ || echo "Backend copy failed"
    - cp -r frontend/dist ~/deployment/frontend/ || echo "Frontend copy failed"
    - cp docker-compose.prod.yml ~/deployment/ || echo "Docker compose copy failed"
    - cp backend/Dockerfile.prod ~/deployment/backend/ || echo "Backend Dockerfile copy failed"
    - cp frontend/Dockerfile.prod ~/deployment/frontend/ || echo "Frontend Dockerfile copy failed"
    - echo "Files copied to ~/deployment - manual deployment needed"
    - ls -la ~/deployment/
    - echo "DEPLOYMENT READY - Files available in /home/gitlab-runner/deployment/"
    - echo "Run manual deployment with proper sudo permissions"
  environment:
    name: production
    url: https://103.88.121.146
  only:
    - dev
  when: manual
