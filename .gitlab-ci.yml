# GitLab CI/CD Pipeline cho Doanhoi Portal
# Tự động deploy khi push vào nhánh dev

stages:
  - test
  - build
  - deploy

variables:
  # Production server config
  PRODUCTION_SERVER: "103.88.121.146"
  PRODUCTION_USER: "root"
  DEPLOY_PATH: "/opt/doanhoi-portal"
  DOMAIN: "doanhoi.hcmut.edu.vn"
  
  # Docker config
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

# Stage 1: Test và Validation
test_backend:
  stage: test
  image: node:20.17-alpine
  cache:
    key: backend-$CI_COMMIT_REF_SLUG
    paths:
      - backend/node_modules/
  before_script:
    - cd backend
    - npm ci
  script:
    - echo "🧪 Testing Backend..."
    - npm run lint || echo "⚠️ Lint warnings found"
    - npm run build
    - echo "✅ Backend tests completed"
  artifacts:
    paths:
      - backend/dist/
      - backend/package*.json
      - backend/tsconfig*.json
      - backend/nest-cli.json
    expire_in: 2 hours
  only:
    - dev
    - main

test_frontend:
  stage: test
  image: node:18-alpine
  cache:
    key: frontend-$CI_COMMIT_REF_SLUG
    paths:
      - frontend/node_modules/
  before_script:
    - cd frontend
    - npm ci
  script:
    - echo "🧪 Testing Frontend..."
    - npm run lint || echo "⚠️ Lint warnings found"
    - npm run build
    - echo "✅ Frontend tests completed"
  artifacts:
    paths:
      - frontend/dist/
      - frontend/package*.json
      - frontend/tsconfig*.json
      - frontend/vite.config.ts
      - frontend/nginx.conf
    expire_in: 2 hours
  only:
    - dev
    - main

# Stage 2: Build Artifacts
build_artifacts:
  stage: build
  image: alpine:latest
  dependencies:
    - test_backend
    - test_frontend
  script:
    - echo "📦 Preparing deployment artifacts..."
    - ls -la
    - echo "✅ Build artifacts ready"
  artifacts:
    name: "doanhoi-portal-$CI_COMMIT_SHORT_SHA"
    paths:
      - backend/
      - frontend/
      - docker-compose.prod.yml
      - .env.production
    expire_in: 1 day
  only:
    - dev
    - main

# Stage 3: Deploy to Production Server
deploy_production:
  stage: deploy
  image: alpine:latest
  dependencies:
    - build_artifacts
  before_script:
    # Install required packages
    - apk add --no-cache openssh-client rsync curl bash sshpass
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile=/dev/null\n\n" > ~/.ssh/config
    - chmod 600 ~/.ssh/config
  script:
    - echo "🚀 Starting deployment to production server..."
    
    # Debug SSH connection
    - echo "🔍 Debugging SSH connection..."
    - echo "Server: $PRODUCTION_SERVER"
    - echo "User: $PRODUCTION_USER"
    - echo "Password length: ${#SSH_PASSWORD}"
    
    # Alternative SSH method with password file
    - echo "$SSH_PASSWORD" > /tmp/ssh_pass
    - chmod 600 /tmp/ssh_pass
    - echo "🧪 Testing SSH with password file..."
    - sshpass -f /tmp/ssh_pass ssh -o ConnectTimeout=30 $PRODUCTION_USER@$PRODUCTION_SERVER "echo '✅ SSH connection successful'"
    
    # Create deployment directory
    - sshpass -f /tmp/ssh_pass ssh $PRODUCTION_USER@$PRODUCTION_SERVER "mkdir -p $DEPLOY_PATH/temp-deploy-$CI_COMMIT_SHORT_SHA && echo '📁 Created temporary deployment directory'"
    
    # Upload files to server
    - echo "📤 Uploading files to server..."
    - sshpass -f /tmp/ssh_pass rsync -avz --delete ./ $PRODUCTION_USER@$PRODUCTION_SERVER:$DEPLOY_PATH/temp-deploy-$CI_COMMIT_SHORT_SHA/
    
    # Execute deployment script
    - echo "🔨 Executing deployment script..."
    - sshpass -f /tmp/ssh_pass ssh $PRODUCTION_USER@$PRODUCTION_SERVER "cd $DEPLOY_PATH/temp-deploy-$CI_COMMIT_SHORT_SHA && echo '=== 🚀 Starting Doanhoi Portal Deployment ===' && echo '📅 Deployment time:' \$(date)"
    
    # Backup and update files
    - sshpass -f /tmp/ssh_pass ssh $PRODUCTION_USER@$PRODUCTION_SERVER "cd $DEPLOY_PATH/temp-deploy-$CI_COMMIT_SHORT_SHA && if [ -f $DEPLOY_PATH/docker-compose.prod.yml ]; then cp $DEPLOY_PATH/docker-compose.prod.yml $DEPLOY_PATH/docker-compose.prod.yml.backup-\$(date +%Y%m%d_%H%M%S); fi"
    - sshpass -f /tmp/ssh_pass ssh $PRODUCTION_USER@$PRODUCTION_SERVER "cd $DEPLOY_PATH/temp-deploy-$CI_COMMIT_SHORT_SHA && cp -r * $DEPLOY_PATH/"
    
    # Stop and start containers
    - sshpass -f /tmp/ssh_pass ssh $PRODUCTION_USER@$PRODUCTION_SERVER "cd $DEPLOY_PATH && docker-compose -f docker-compose.prod.yml down --timeout 30 || true"
    - sshpass -f /tmp/ssh_pass ssh $PRODUCTION_USER@$PRODUCTION_SERVER "cd $DEPLOY_PATH && docker image prune -f || true"
    - sshpass -f /tmp/ssh_pass ssh $PRODUCTION_USER@$PRODUCTION_SERVER "cd $DEPLOY_PATH && docker-compose -f docker-compose.prod.yml up -d --build"
    
    # Wait and health check
    - echo "⏳ Waiting for containers to initialize..."
    - sleep 45
    - sshpass -f /tmp/ssh_pass ssh $PRODUCTION_USER@$PRODUCTION_SERVER "cd $DEPLOY_PATH && docker-compose -f docker-compose.prod.yml ps"
    
    # Final verification
    - echo "🔍 Final verification from GitLab runner..."
    - "if curl -f -k https://$DOMAIN >/dev/null 2>&1; then echo '🎉 SUCCESS: Deployment completed!'; else echo '⚠️ WARNING: Domain verification failed'; fi"
  
  environment:
    name: production
    url: https://doanhoi.hcmut.edu.vn
  
  only:
    - dev
    - main
  
  when: on_success  # Tự động deploy khi merge vào main

# Rollback job (manual trigger only)
rollback_production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client bash sshpass
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile=/dev/null\n\n" > ~/.ssh/config
    - chmod 600 ~/.ssh/config
  script:
    - echo "🔄 Starting rollback procedure..."
    - echo "$SSH_PASSWORD" > /tmp/ssh_pass
    - chmod 600 /tmp/ssh_pass
    - sshpass -f /tmp/ssh_pass ssh $PRODUCTION_USER@$PRODUCTION_SERVER "cd $DEPLOY_PATH && echo '=== 🔄 Starting Rollback ==='"
    - sshpass -f /tmp/ssh_pass ssh $PRODUCTION_USER@$PRODUCTION_SERVER "cd $DEPLOY_PATH && BACKUP_FILE=\$(ls -t docker-compose.prod.yml.backup-* 2>/dev/null | head -n1) && echo 'Latest backup:' \$BACKUP_FILE"
    - sshpass -f /tmp/ssh_pass ssh $PRODUCTION_USER@$PRODUCTION_SERVER "cd $DEPLOY_PATH && docker-compose -f docker-compose.prod.yml down --timeout 30 || true"
    - sshpass -f /tmp/ssh_pass ssh $PRODUCTION_USER@$PRODUCTION_SERVER "cd $DEPLOY_PATH && BACKUP_FILE=\$(ls -t docker-compose.prod.yml.backup-* 2>/dev/null | head -n1) && cp \$BACKUP_FILE docker-compose.prod.yml"
    - sshpass -f /tmp/ssh_pass ssh $PRODUCTION_USER@$PRODUCTION_SERVER "cd $DEPLOY_PATH && docker-compose -f docker-compose.prod.yml up -d"
    - sshpass -f /tmp/ssh_pass ssh $PRODUCTION_USER@$PRODUCTION_SERVER "cd $DEPLOY_PATH && sleep 30 && docker-compose -f docker-compose.prod.yml ps"
    - echo "✅ Rollback completed"
  
  environment:
    name: production
    url: https://doanhoi.hcmut.edu.vn
  
  only:
    - dev
    - main
  
  when: manual
