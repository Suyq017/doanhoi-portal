image: docker:24.0.5
services:
  - docker:24.0.5-dind

stages:
  - test
  - build-push
  - deploy

# STAGE 1: test backend
test_backend:
  stage: test
  image: node:20.17-alpine
  script:
    - cd backend
    - npm ci
    - npm run lint
  only:
    - dev

test_frontend:
  stage: test
  image: node:18-alpine
  script:
    - cd frontend
    - npm ci
    - npm run lint || true
  only:
    - dev

# STAGE 2: build & push
build_push_image:
  stage: build-push
  script:
    - echo "Logging into Gitlab Container Registry..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

    - echo "Building & Pushing Backend..."
    - docker build -t -f ./backend/Dockerfile.prod $BACKEND_IMAGE:latest -t $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA ./backend
    - docker push $BACKEND_IMAGE:latest
    - docker push $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA

    - echo "Building & Pushing Frontend..."
    - docker build -t -f ./backend/Dockerfile.prod $FRONTEND_IMAGE:latest -t $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA ./frontend
    - docker push $FRONTEND_IMAGE:latest
    - docker push $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
  only:
    - dev

# STAGE 3: deploy to production
deploy_production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client curl
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:
    - echo "Deploying to Server..."
    - scp docker-compose.prod.yml $PRODUCTION_USER@$PRODUCTION_SERVER:$DEPLOY_PATH/docker-compose.yml

    - |
      ssh $PRODUCTION_USER@PRODUCTION_SERVER << EOF
        cd $DEPLOY_PATH

        echo "Logging into Registry..."
        - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

        echo "Pulling new images..."
        export CI_REGISTRY_IMAGE=ci_image
        docker-compose pull

        echo "Restarting container..."
        docker-compose up -d -remove-orphans

        echo 'Cleaning up old images...'
        docker image prune -f
      EOF
  environment:
    name: production
    url: https://doanhoi.hcmut.edu.vn
  only:
    - dev

  