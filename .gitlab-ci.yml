image: docker:24.0.5
services:
  - docker:24.0.5-dind

stages:
  - test
  - build-push
  - deploy
  - rollback

variables:
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend

# STAGE 1: test backend
test_backend:
  stage: test
  image: node:20.17-alpine
  script:
    - cd backend
    - npm ci
    - npm run lint || true
  only:
    - dev

test_frontend:
  stage: test
  image: node:18-alpine
  script:
    - cd frontend
    - npm ci
    - npm run lint || true
  only:
    - dev

# STAGE 2: build & push
build_push_image:
  stage: build-push
  script:
    - echo "Logging into Gitlab Container Registry..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

    - echo "Building & Pushing Backend..."
    - docker build --no-cache -f ./backend/Dockerfile.prod -t $BACKEND_IMAGE:latest -t $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA ./backend
    - docker push $BACKEND_IMAGE:latest
    - docker push $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA

    - echo "Building & Pushing Frontend..."
    - docker build --no-cache -f ./frontend/Dockerfile.prod -t $FRONTEND_IMAGE:latest -t $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA ./frontend
    - docker push $FRONTEND_IMAGE:latest
    - docker push $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
  only:
    - dev

# STAGE 3: deploy to production
deploy_production:
  stage: deploy
  image: alpine:latest
  when: manual

  before_script:
    - apk add --no-cache openssh-client curl
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:
    - echo "🚀 Deploying version $CI_COMMIT_SHORT_SHA..."
    - scp docker-compose.prod.yml $PRODUCTION_USER@$PRODUCTION_SERVER:$DEPLOY_PATH/docker-compose.yml
    - |
      ssh $PRODUCTION_USER@$PRODUCTION_SERVER << ENDSSH
        cd $DEPLOY_PATH
        
        echo "🔐 Logging into Registry..."
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
        
        echo "⬇️ Pulling new version..."
        export TAG=$CI_COMMIT_SHORT_SHA
        export CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE
        
        docker-compose pull
        
        echo "🔄 Restarting containers..."
        docker-compose up -d --remove-orphans
        
        echo "✅ Verifying deployment..."
        docker-compose ps
        
        echo "🧹 Cleanup..."
        docker image prune -f
      ENDSSH
  environment:
    name: production
    url: https://doanhoi.hcmut.edu.vn
  only:
    - dev

# STAGE 4: rollback to previous version
rollback_production:
  stage: rollback
  image: alpine:latest
  when: manual
  
  variables:
    ROLLBACK_TAG: "latest"  # Can be overridden with specific commit SHA
  
  before_script:
    - apk add --no-cache openssh-client curl
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - printf "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  
  script:
    - echo "🔄 Rolling back to version $ROLLBACK_TAG..."
    - |
      ssh $PRODUCTION_USER@$PRODUCTION_SERVER << ENDSSH
        cd $DEPLOY_PATH
        
        echo "📋 Checking current deployment status..."
        docker-compose ps
        
        echo "🔐 Logging into Registry..."
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
        
        echo "⬇️ Pulling rollback version: $ROLLBACK_TAG..."
        export TAG=$ROLLBACK_TAG
        export CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE
        
        docker-compose pull
        
        echo "🔄 Recreating containers with version $ROLLBACK_TAG..."
        docker-compose up -d --force-recreate --remove-orphans
        
        echo "✅ Verifying rollback..."
        docker-compose ps
        
        echo "🧹 Cleanup..."
        docker image prune -f
        
        echo "✅ Rollback to $ROLLBACK_TAG completed successfully!"
      ENDSSH
  
  environment:
    name: production
    url: https://doanhoi.hcmut.edu.vn
    action: access
  
  only:
    - dev

  