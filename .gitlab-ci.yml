image: docker:24.0.5
services:
  - docker:24.0.5-dind

stages:
  - test
  - build-push
  - deploy

variables:
  # Nên để trong ngoặc kép để tránh lỗi format
  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend"

# STAGE 1: test backend
test_backend:
  stage: test
  image: node:20.17-alpine
  script:
    - cd backend
    - npm ci
    - npm run lint || true
  only:
    - dev

test_frontend:
  stage: test
  image: node:18-alpine
  script:
    - cd frontend
    - npm ci
    - npm run lint || true
  only:
    - dev

# STAGE 2: build & push
build_push_image:
  stage: build-push
  script:
    - echo "Logging into Gitlab Container Registry..."
    # Đã sửa: Thêm ngoặc kép bao quanh các lệnh có biến $ để an toàn
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    
    - echo "🔍 DEBUG: Ta đang ở thư mục gốc:"
    - pwd
    - ls -la
    
    - echo "🔍 DEBUG: Soi bên trong thư mục backend:"
    - ls -la backend
    
    - echo "Building & Pushing Backend..."
    # Đã sửa: Gom lệnh dài vào ngoặc kép để tránh YAML hiểu sai dấu : trong tag
    - "docker build --no-cache -f ./backend/Dockerfile.prod -t $BACKEND_IMAGE:latest -t $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA ./backend"
    - "docker push $BACKEND_IMAGE:latest"
    - "docker push $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    
    - echo "Building & Pushing Frontend..."
    - "docker build --no-cache -f ./frontend/Dockerfile.prod -t $FRONTEND_IMAGE:latest -t $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA ./frontend"
    - "docker push $FRONTEND_IMAGE:latest"
    - "docker push $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
  only:
    - dev

# STAGE 3: deploy to production
deploy_production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client curl
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    # Đã sửa: Dùng printf thay vì echo -e để chuẩn POSIX hơn trên Alpine
    - printf "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:
    - echo "Deploying to Server..."
    - scp docker-compose.prod.yml $PRODUCTION_USER@$PRODUCTION_SERVER:$DEPLOY_PATH/docker-compose.yml
    
    # QUAN TRỌNG: Đã đổi 'EOF' thành EOF (bỏ nháy đơn) 
    # Nếu để nháy đơn 'EOF', các biến $CI_... sẽ không được điền giá trị
    - |
      ssh $PRODUCTION_USER@$PRODUCTION_SERVER << EOF
        cd $DEPLOY_PATH
        
        echo "Logging into Registry..."
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
        
        echo "Pulling new images..."
        export CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE
        docker-compose pull
        
        echo "Restarting container..."
        docker-compose up -d --remove-orphans
        
        echo "Cleaning up old images..."
        docker image prune -f
      EOF
  environment:
    name: production
    url: https://doanhoi.hcmut.edu.vn
  only:
    - dev