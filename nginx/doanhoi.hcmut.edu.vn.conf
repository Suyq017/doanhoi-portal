# ==============================
# Configuration for doanhoi.hcmut.edu.vn
# ==============================

# HTTPS server (main site)
server {
    listen 443 ssl http2;
    server_name doanhoi.hcmut.edu.vn;

    # SSL certificate
    ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    # SSL settings
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 10m;
    ssl_ciphers PROFILE=SYSTEM;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # =========================================
    # GRAFANA - https://doanhoi.hcmut.edu.vn/grafana/
    # =========================================
    location /grafana/ {
        # KHÔNG rewrite! Grafana tự xử lý subpath với GF_SERVER_SERVE_FROM_SUB_PATH=true
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        
        # WebSocket support (for live updates)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings (for long-running queries)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # =========================================
    # PROMETHEUS - https://doanhoi.hcmut.edu.vn/prometheus/
    # =========================================
    location /prometheus/ {
        # Rewrite để xóa /prometheus/ prefix trước khi forward
        rewrite ^/prometheus/(.*) /$1 break;
        proxy_pass http://localhost:9091;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # =========================================
    # BACKEND API - /api/
    # =========================================
    location /api/ {
        proxy_pass http://localhost:2681/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # =========================================
    # FRONTEND - /
    # =========================================
    location / {
        client_max_body_size 10M;
        proxy_pass http://localhost:2680;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
    }
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name doanhoi.hcmut.edu.vn;
    return 301 https://$host$request_uri;
}
