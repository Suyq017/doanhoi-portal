volumes:
  postgres_data:
    driver: local
  # pgadmin_data:
  #   driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  # ollama_data:
  #   driver: local

networks:
  doanhoi-network:
    driver: bridge
