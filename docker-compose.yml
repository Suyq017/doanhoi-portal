  #     - doanhoi-network
  #   depends_on:
  #     - postgres
  #   restart: unless-stopped

  redis:
    image: redis:8.2.3
    container_name: doanhoi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - doanhoi-network
    restart: unless-stopped
    command: [
      "redis-server", 
      "--appendonly", "yes",
      "--requirepass", "mat_khau_redis"
      ]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: doanhoi-backend
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DB_NAME: doanhoi
      PORT: 9200
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PGVECTOR_CONNECTION_STRING: postgresql://postgres:password@postgres:5432/doanhoi
    ports:
      - "9200:9200"
    depends_on:
      - postgres
      - redis
    networks:
      - doanhoi-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: doanhoi-frontend
    ports:
      - "9100:80"
    depends_on:
      - backend
    networks:
      - doanhoi-network
    restart: unless-stopped

